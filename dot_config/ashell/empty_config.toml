log_level = "warn"
outputs = "All"

[modules]
left = [ "Workspaces" ] 
center = []
right = [ "Tray", "Tempo", "Privacy", "Settings" ] 

[workspaces]
visibility_mode = "MonitorSpecificExclusive"
group_by_monitor = true
enable_workspace_filling = true

[tempo]
clock_format = "%a %d %b %R"

[settings]
lock_cmd = "pidof hyprlock || hyprlock"
shutdown_cmd = "hyprshutdown --post-cmd 'shutdown'"
reboot_cmd = "hyprshutdown --post-cmd 'reboot'"
logout_cmd = "hyprshutdown --post-cmd 'loginctl kill_user $(whoami)'"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
remove_airplane_btn = true
battery_format = "IconAndPercentage"
peripheral_battery_format = "Icon"
audio_indicator_format = "Icon"
microphone_indicator_format = "Icon"
network_indicator_format = "Icon"
bluetooth_indicator_format = "Icon"
brightness_indicator_format = "Icon"
indicators = [ "IdleInhibitor", "PowerProfile", "Audio", "Bluetooth", "Network", "Battery" ]

[appearance]
style = "Islands"
scale_factor = 1.5
font_name = "CodeNewRoman Nerd Font"

primary_color = "#eb5e28"
success_color = "#9ece6a"
text_color = "#fffcf2"

[appearance.danger_color]
base = "#f7768e"
weak = "#e0af68"

background_color = "#252422"

secondary_color = "#ccc5b9"
